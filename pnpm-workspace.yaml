packages:
  - 'packages/*'
  - 'packages/deprecated/*'

linkWorkspacePackages: true

nodeLinker: hoisted

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@yardinternet/*'

# Security pins for transitive dev-tooling deps. Drop once upstream ranges include the fix.
overrides:
  'js-yaml@>=4 <4.3.1': ^4.3.1
  'markdown-it@<14.2.0': ^14.2.0
  'minimatch@>=3 <3.1.3': ^3.1.3
  'serialize-javascript@<7.0.5': ^7.0.5
  'uuid@<11.1.1': ^11.1.1
